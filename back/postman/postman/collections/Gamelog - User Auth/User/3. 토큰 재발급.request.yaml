$kind: http-request
description: refreshToken 쿠키가 자동으로 전송됩니다 (2번 로그인 요청을 먼저 실행해서 쿠키가 저장되어 있어야 함).
  Postman 쿠키 자동 전송 설정이 켜져 있어야 합니다.
url: "{{baseUrl}}/api/v1/users/refresh"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const res = pm.response.json();
          pm.environment.set("accessToken", res.data.accessToken);
          console.log("accessToken 갱신됨:", res.data.accessToken);
      } else {
          console.log("재발급 실패:", pm.response.text());
      }
    language: text/javascript
order: 4503040615874958
