spring:
  application:
    name: gamelog
  profiles:
    active: local
# ===== jwt 토큰 =====
jwt:
  secret: 2yFvv+amd1bJKWDQ/picSaxbhQ+VKrMIjFqIqbBqib8=
  access-token-validity: 3600000 #1시간
  refresh-token-validity: 1209600000 #14일

# === cors === 로컬/test 그대로 상속
# 프론트가 Next.js 프록시(브라우저->Vercel->Railway)로 백엔드를 호출하는 것이 지금 프론트형태
# 정상 트래픽은 이 CORS 설정을 안 타고 지나감 — 직접 호출하는 경우를 위한 안전망
app:
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    same-site: Lax
    secure: false

# === igdb ===

igdb:
  client-id: ${IGDB_CLIENT_ID}
  client-secret: ${IGDB_CLIENT_SECRET}

# === cloudinary ===

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

---
# ===== 로컬 개발 (Docker MySQL) =====
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/gamelog?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:gamelog}
    password: ${DB_PASSWORD:gamelog1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always   # data.sql 항상 실행 (중복 방지 필요하면 always -> never로 바꾸고 수동 실행)

---
# ===== 테스트 (H2 인메모리) =====
igdb:
  client-id: test-client-id
  client-secret: test-client-secret
  import:
    enabled: false

cloudinary:
  cloud-name: test-cloud-name
  api-key: test-api-key
  api-secret: test-api-secret

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never   # 엔티티로 스키마 생성하고, 데이터는 각 테스트에서 직접 넣기

---
# ===== 배포 (Railway) =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 운영에서는 절대 update/create 쓰지 말 것
    show-sql: false
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}

# 마찬가지로 안전망 — 프록시 경유 트래픽에는 적용 안 됨
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    same-site: None
    secure: true
